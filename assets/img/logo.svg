<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7C42BC"/>
      <stop offset="100%" stop-color="#4E247A"/>
    </linearGradient>
    <linearGradient id="shield" x1="50" y1="22" x2="50" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ede0ff" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2d0a5a" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Fondo redondeado -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>

  <!-- Brillo sutil en la parte superior -->
  <ellipse cx="50" cy="12" rx="36" ry="12" fill="white" fill-opacity="0.08"/>

  <!-- Escudo principal (bóveda / vault) -->
  <path d="M50 21 L73 32 L73 54 Q73 70 50 80 Q27 70 27 54 L27 32 Z"
        fill="url(#shield)" filter="url(#soft)"/>

  <!-- Línea divisoria superior del escudo -->
  <path d="M50 21 L73 32" stroke="white" stroke-width="1" stroke-opacity="0.4" fill="none"/>
  <path d="M50 21 L27 32" stroke="white" stroke-width="1" stroke-opacity="0.4" fill="none"/>

  <!-- Punto del "i" (INTELLIHELP) -->
  <circle cx="50" cy="38" r="6" fill="#5A2392"/>

  <!-- Cuerpo del "i" -->
  <rect x="44.5" y="48" width="11" height="22" rx="4" fill="#5A2392"/>

  <!-- Punto de estado verde (acento de marca) -->
  <circle cx="73" cy="22" r="9.5" fill="#7AB520"/>
  <circle cx="73" cy="22" r="6.5" fill="#9CC930"/>
  <circle cx="71" cy="20" r="2.5" fill="#C2E855" fill-opacity="0.7"/>
</svg>
