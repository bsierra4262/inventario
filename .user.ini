; =====================================================================
;  INTELLIHELP Asset Vault — configuración PHP por directorio
;
;  Hostinger corre PHP como FastCGI, así que lee este archivo y aplica
;  estos valores a todo el árbol. Poner los flags de sesión acá (y no
;  con ini_set() en cada entry point) garantiza que apliquen aunque un
;  archivo arranque la sesión antes de incluir platform.php — que es
;  exactamente lo que hacía backend/csrf.php.
; =====================================================================

; --- Sesión ---
; La cookie de sesión salía sólo con "secure": la podía leer cualquier
; JavaScript y viajaba en peticiones cross-site.
session.cookie_httponly = 1
session.cookie_secure   = 1
session.cookie_samesite = Lax
; Rechaza IDs de sesión que el servidor nunca emitió. Sin esto, un
; atacante puede fijar un PHPSESSID y quedarse con la sesión del usuario.
session.use_strict_mode = 1
session.use_only_cookies = 1
session.gc_maxlifetime  = 28800

; --- Errores: nunca al navegador ---
display_errors         = 0
display_startup_errors = 0
log_errors             = 1

; --- No anunciar la versión de PHP ---
expose_php = 0
